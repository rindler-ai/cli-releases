name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Bounded because nothing else bounds it. An unbounded hosted job is what
    # took org-wide Actions billing down on 2026-08-19: a hanging macOS job with
    # no ceiling burned the balance until everything stopped starting. This job
    # is stdlib-only gofmt/vet/test plus four cross-builds -- the sibling
    # `release` job does strictly more work and completed in 87s -- so ten
    # minutes is a hang detector, not a budget.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "::error::gofmt needed:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test ./...
      - name: Cross-compile every released target
        env:
          CGO_ENABLED: "0"
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null .
          done
